spring.application.name=springbootbackend

# -----------------------------
# Database (MySQL)
# -----------------------------
# Uses env vars provided by the database container:
# MYSQL_URL, MYSQL_USER, MYSQL_PASSWORD, MYSQL_DB, MYSQL_PORT
spring.datasource.url=jdbc:mysql://${MYSQL_URL:localhost}:${MYSQL_PORT:3306}/${MYSQL_DB:myapp}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${MYSQL_USER:appuser}
spring.datasource.password=${MYSQL_PASSWORD:dbuser123}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# -----------------------------
# Security / JWT
# -----------------------------
# IMPORTANT: set QDMS_JWT_SECRET in .env (minimum 32 chars recommended)
qdms.jwt.secret=${QDMS_JWT_SECRET:change-me-in-env-change-me-in-env-32chars}
qdms.jwt.issuer=qdms
qdms.jwt.accessTokenMinutes=120

# -----------------------------
# Actuator
# -----------------------------
management.endpoints.web.exposure.include=health,info,metrics

# -----------------------------
# Swagger/OpenAPI
# -----------------------------
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha

# Respect X-Forwarded-* / Forwarded headers so redirects preserve external scheme/host/port
server.forward-headers-strategy=framework
